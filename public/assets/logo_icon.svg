<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="white-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d4d4d8" />
    </linearGradient>
    <linearGradient id="silver-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a1a1aa" />
      <stop offset="100%" stop-color="#71717a" />
    </linearGradient>
  </defs>

  <!-- Clean Transparent Waveform 'W' for Taskbar & Tray -->
  <g transform="translate(16, 16)">
    <!-- Bar 1 -->
    <rect x="18" y="56" width="18" height="112" rx="9" fill="url(#silver-grad)" opacity="0.8" />
    <!-- Bar 2 -->
    <rect x="46" y="92" width="18" height="76" rx="9" fill="url(#silver-grad)" opacity="0.95" />
    <!-- Bar 3 -->
    <rect x="74" y="40" width="18" height="144" rx="9" fill="url(#white-grad)" />
    <!-- Bar 4 Center pulse -->
    <rect x="104" y="78" width="16" height="68" rx="8" fill="#ffffff" />
    <!-- Bar 5 -->
    <rect x="132" y="40" width="18" height="144" rx="9" fill="url(#white-grad)" />
    <!-- Bar 6 -->
    <rect x="160" y="92" width="18" height="76" rx="9" fill="url(#silver-grad)" opacity="0.95" />
    <!-- Bar 7 -->
    <rect x="188" y="56" width="18" height="112" rx="9" fill="url(#silver-grad)" opacity="0.8" />
  </g>
</svg>

